<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Inclinación en CSS3</title>
<style>
body {
  font-family: "Times New Roman", Times, serif;
  padding: 100px;
}
#caja {
  width: 200px;
  height: 120px;
  line-height: 120px;
  text-align: center;
  font-size: 1.6em;
  background-color: lightgray;
  border: 2px solid black;
  border-radius: 15px;
  animation-name: inclinar;
  animation-duration: 6s;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
}
@keyframes inclinar {
  0%   { transform: skew(0deg, 0deg); }
  25%  { transform: skewY(30deg); }
  50%  { transform: skew(0deg, 0deg); }
  75%  { transform: skewX(30deg); }
  100% { transform: skew(0deg, 0deg); }
}
</style>
<style id="site-nav-css">
html{padding-bottom:70px}
#site-nav{position:fixed;left:0;right:0;bottom:0;z-index:99999;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;background:#1f2937;padding:12px;margin:0;font-family:Arial,sans-serif;box-shadow:0 -2px 10px rgba(0,0,0,.25)}
#site-nav a{color:#fff;background:#2563eb;text-decoration:none;padding:9px 14px;border-radius:7px;font-size:14px;font-family:Arial,sans-serif;line-height:1.2}
#site-nav a:hover{background:#1d4ed8}
</style>
</head>
<body>
<div id="caja">Inclinar texto</div>

</div>
</body>
</html>
