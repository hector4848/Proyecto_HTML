<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ejercicio 10.10</title>
</head>
<body>
    <h1>10.10 Comisiones de ventas</h1>

    <form onsubmit="agregar(); return false;">
        <label for="ventas">Ventas brutas de la semana ($):</label>
        <input id="ventas" type="number" min="0" step="any" required>
        <input type="submit" value="Agregar vendedor">
    </form>

    <h2>Vendedores por rango de salario</h2>
    <pre id="salida"></pre>

    <script>
        var etiquetas = [ "$200 a 299", "$300 a 399", "$400 a 499",
                          "$500 a 599", "$600 a 699", "$700 a 799",
                          "$800 a 899", "$900 a 999", "$1000 y más" ];

        // Arreglo de contadores, uno por cada rango
        var contadores = new Array( 9 );

        for ( var i = 0; i < contadores.length; ++i )
        {
            contadores[ i ] = 0;
        }

        function agregar()
        {
            var ventas = parseFloat( document.getElementById( "ventas" ).value );

            if ( isNaN( ventas ) || ventas < 0 )
            {
                alert( "Escriba un monto de ventas válido." );
                return;
            }

            // $200 más el 9% de las ventas, truncado a un monto entero
            var salario = Math.floor( 200 + ventas * 9 / 100 );

            // $200-299 -> índice 0, $300-399 -> índice 1, ..., $1000 o más -> índice 8
            var indice = Math.floor( salario / 100 ) - 2;

            if ( indice > 8 )
            {
                indice = 8;
            }

            ++contadores[ indice ];

            document.getElementById( "ventas" ).value = "";
            mostrar( salario );
        }

        function mostrar( ultimoSalario )
        {
            var texto = "Último salario calculado: $" + ultimoSalario + "\n\n";

            for ( var i = 0; i < contadores.length; ++i )
            {
                texto += etiquetas[ i ] + ":  " + contadores[ i ] + "\n";
            }

            document.getElementById( "salida" ).textContent = texto;
        }
    </script>
