    <meta charset="utf-8">
    <title>Ejercicio 10.17</title>
</head>
<body>
    <h1>10.17 La tortuga y la liebre</h1>
    <button id="boton" onclick="iniciar()">Iniciar carrera</button>
    <pre id="salida"></pre>

    <script>
        var TIC = 1000;          // milisegundos entre cada tic del reloj
        var META = 70;

        var tortuga, liebre, reloj;

        function iniciar()
        {
            document.getElementById( "boton" ).disabled = true;
            document.getElementById( "salida" ).textContent = "PUM!!!\nY ARRANCAN!!!\n";

            tortuga = 1;
            liebre = 1;
            reloj = setInterval( tic, TIC );
        }

        function aleatorio()
        {
            return Math.floor( 1 + Math.random() * 10 );     // entero de 1 a 10
        }

        function moverTortuga()
        {
            var i = aleatorio();

            if ( i <= 5 )           // 50%: paso pesado rápido
            {
                tortuga += 3;
            }
            else if ( i <= 7 )      // 20%: resbalón
            {
                tortuga -= 6;
            }
            else                    // 30%: paso pesado lento
            {
                tortuga += 1;
            }

            if ( tortuga < 1 )
            {
                tortuga = 1;
            }
        }

        function moverLiebre()
        {
            var i = aleatorio();

            if ( i <= 2 )           // 20%: dormir
            {
                // ningún movimiento
            }
            else if ( i <= 4 )      // 20%: gran salto
            {
                liebre += 9;
            }
            else if ( i == 5 )      // 10%: gran resbalón
            {
                liebre -= 12;
            }
            else if ( i <= 8 )      // 30%: pequeño salto
            {
                liebre += 1;
            }
            else                    // 20%: pequeño resbalón
            {
                liebre -= 2;
            }

            if ( liebre < 1 )
            {
                liebre = 1;
            }
        }

        function dibujarLinea()
        {
            var linea = new Array( META );

            for ( var p = 0; p < META; ++p )
            {
                linea[ p ] = " ";
            }

            // Para dibujar, las posiciones pasadas de la meta se ajustan a 70
            var posT = Math.min( tortuga, META );
            var posH = Math.min( liebre, META );

            if ( posT == posH )
            {
                // La tortuga muerde a la liebre: OUCH!!! empezando en esa posición
                var mensaje = "OUCH!!!";

                for ( var k = 0; k < mensaje.length && posT - 1 + k < META; ++k )
                {
                    linea[ posT - 1 + k ] = mensaje.charAt( k );
                }
            }
            else
            {
                linea[ posT - 1 ] = "T";
                linea[ posH - 1 ] = "H";
            }

            return linea.join( "" ) + "|\n";
        }

        function tic()
        {
            var salida = document.getElementById( "salida" );

            moverTortuga();
            moverLiebre();

            salida.textContent += dibujarLinea();

            var tortugaLlego = tortuga >= META;
            var liebreLlego = liebre >= META;

            if ( tortugaLlego || liebreLlego )
            {
                if ( tortugaLlego && liebreLlego )
                {
                    salida.textContent += "Es un empate.\n";
                }
                else if ( tortugaLlego )
                {
                    salida.textContent += "LA TORTUGA GANA!!! YAY!!!\n";
                }
                else
                {
                    salida.textContent += "La liebre gana. Que mal.\n";
                }

                clearInterval( reloj );
                document.getElementById( "boton" ).disabled = false;
                document.getElementById( "boton" ).textContent = "Correr otra carrera";
            }
        }
    </script>
