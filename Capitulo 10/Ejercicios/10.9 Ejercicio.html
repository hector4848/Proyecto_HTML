<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ejercicio 10.9</title>
</head>
<body>
    <h1>10.9 Arreglo de dos por tres</h1>
    <pre id="salida"></pre>

    <script>
        var salida = document.getElementById( "salida" );

        // a) Declarar y crear el arreglo t (2 filas, 3 columnas)
        var t = new Array( new Array( 3 ), new Array( 3 ) );

        // b) ¿Cuántas filas tiene t?
        salida.textContent += "b) filas: " + t.length + "\n";

        // c) ¿Cuántas columnas tiene t?
        salida.textContent += "c) columnas: " + t[ 0 ].length + "\n";

        // d) ¿Cuántos elementos tiene t?
        salida.textContent += "d) elementos: " + ( t.length * t[ 0 ].length ) + "\n";

        // e) Nombres de todos los elementos de la fila 1
        salida.textContent += "e) t[ 1 ][ 0 ], t[ 1 ][ 1 ], t[ 1 ][ 2 ]\n";

        // f) Nombres de todos los elementos de la tercera columna
        salida.textContent += "f) t[ 0 ][ 2 ], t[ 1 ][ 2 ]\n";

        // g) Establecer el elemento de la fila 1 y la columna 2 en cero
        t[ 1 ][ 2 ] = 0;

        // h) Serie de instrucciones para inicializar cada elemento en cero
        t[ 0 ][ 0 ] = 0;
        t[ 0 ][ 1 ] = 0;
        t[ 0 ][ 2 ] = 0;
        t[ 1 ][ 0 ] = 0;
        t[ 1 ][ 1 ] = 0;
        t[ 1 ][ 2 ] = 0;

        // i) Instrucción for anidada para inicializar cada elemento en cero
        for ( var fila = 0; fila < t.length; ++fila )
        {
            for ( var col = 0; col < t[ fila ].length; ++col )
            {
                t[ fila ][ col ] = 0;
            }
        }

        // Datos de ejemplo para probar los incisos siguientes
        t = [ [ 5, 3, 8 ],
              [ 2, 9, 4 ] ];

        // j) Determinar e imprimir el valor más pequeño del arreglo t
        var menor = t[ 0 ][ 0 ];

        for ( var fila = 0; fila < t.length; ++fila )
        {
            for ( var col = 0; col < t[ fila ].length; ++col )
            {
                if ( t[ fila ][ col ] < menor )
                {
                    menor = t[ fila ][ col ];
                }
            }
        }

        salida.textContent += "j) valor más pequeño: " + menor + "\n";

        // k) Mostrar los elementos de la primera fila sin repetición
        salida.textContent += "k) primera fila: " + t[ 0 ].join( " " ) + "\n\n";

        // l) Imprimir t en formato tabular con encabezados de columna e índices de fila
        salida.textContent += "l)      [0]  [1]  [2]\n";

        for ( var fila = 0; fila < t.length; ++fila )
        {
            salida.textContent += "[" + fila + "]    ";

            for ( var col = 0; col < t[ fila ].length; ++col )
            {
                salida.textContent += t[ fila ][ col ] + "    ";
            }

            salida.textContent += "\n";
        }
    </script>
