   <style>
      body { font-family: Arial, sans-serif; max-width: 820px; margin: 20px auto; padding: 0 16px; line-height: 1.5; }
      .enunciado { background: #f4f4f4; border-left: 4px solid #888; padding: 8px 14px; }
      textarea { width: 100%; box-sizing: border-box; font-family: monospace; }
      input[type="text"], input[type="number"], input[type="date"] { padding: 4px; margin: 2px 0; }
      button, input[type="button"] { padding: 5px 12px; margin: 2px 0; cursor: pointer; }

      li { margin-bottom: 6px; }
      b.resp { color: #0a5; }
   </style>

<body>
   <h1>Ejercicio 11.12</h1>
   <div class="enunciado">Escriba una secuencia de comandos que reciba texto de un formulario de HTML5 y lo imprima tanto en mayúsculas como en minúsculas.</div>
   <form action="#">
      <p>Texto: <input type="text" id="texto" size="50">
         <input type="button" id="btnConvertir" value="Convertir"></p>
   </form>
   <p>En mayúsculas:</p>
   <textarea id="mayus" rows="3" readonly></textarea>
   <p>En minúsculas:</p>
   <textarea id="minus" rows="3" readonly></textarea>
   <script>
function convertir() {
   var texto = document.getElementById("texto").value;
   document.getElementById("mayus").value = texto.toUpperCase();
   document.getElementById("minus").value = texto.toLowerCase();
}
window.addEventListener("load", function () {
   document.getElementById("btnConvertir").addEventListener("click", convertir, false);
}, false);
   </script>
