<body>
   <h1>Ejercicio 11.18</h1>
   <div class="enunciado">Modifique su solución al ejercicio 11.17 para que genere todos los posibles códigos de tres dígitos en el rango de 000 a 255, e intente imprimir los caracteres correspondientes. Muestre los resultados en un elemento <code>textarea</code> de HTML5.</div>
   <p><input type="button" id="btnGenerar" value="Generar códigos 000–255"></p>
   <textarea id="salida" rows="25" readonly></textarea>
   <script>
function generar() {
   var t = "";
   for (var i = 0; i <= 255; ++i) {
      var codigo = String(i).padStart(3, "0");
      var imprimible = !(i < 32 || (i >= 127 && i < 160));
      t += codigo + " -> " + (imprimible ? String.fromCharCode(i) : "(no imprimible)") + "\n";
   }
   document.getElementById("salida").value = t;
}
window.addEventListener("load", function () {
   document.getElementById("btnGenerar").addEventListener("click", generar, false);
   generar();
}, false);
   </script>
