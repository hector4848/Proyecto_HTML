      body { font-family: Arial, sans-serif; max-width: 820px; margin: 20px auto; padding: 0 16px; line-height: 1.5; }

<body>
   <h1>Ejercicio 11.5</h1>
   <div class="enunciado">Modifique la solución al ejercicio 11.4 para usar el método <code>round</code> de <code>Math</code> en vez del método <code>floor</code>.</div>
   <p>Número: <input type="number" id="numero" step="any" value="8.5678">
      <input type="button" id="btnRedondear" value="Redondear">
      <input type="button" id="btnLimpiar" value="Limpiar tabla"></p>
   <textarea id="salida" rows="14" readonly></textarea>
   <script>
function redondearAEntero(numero)    { return Math.round( numero ); }
function redondearADecimas(numero)   { return Math.round( numero * 10 ) / 10; }
function redondearACentesimas(numero){ return Math.round( numero * 100 ) / 100; }
function redondearAMilesimas(numero) { return Math.round( numero * 1000 ) / 1000; }

var ENCABEZADO = "Original".padEnd(14) + "Entero".padEnd(10) + "Décima".padEnd(10) + "Centésima".padEnd(12) + "Milésima\n" +
                 "--------".padEnd(14) + "------".padEnd(10) + "------".padEnd(10) + "---------".padEnd(12) + "--------\n";

function leer() {
   var x = parseFloat(document.getElementById("numero").value);
   if (isNaN(x)) { alert("Introduzca un número válido."); return; }
   var salida = document.getElementById("salida");
   if (salida.value === "") salida.value = ENCABEZADO;
   salida.value += String(x).padEnd(14) + String(redondearAEntero(x)).padEnd(10) +
      String(redondearADecimas(x)).padEnd(10) + String(redondearACentesimas(x)).padEnd(12) +
      redondearAMilesimas(x) + "\n";
}
window.addEventListener("load", function () {
   document.getElementById("btnRedondear").addEventListener("click", leer, false);
   document.getElementById("btnLimpiar").addEventListener("click", function () {
      document.getElementById("salida").value = "";
   }, false);
}, false);
   </script>
