<body>
   <h1>Ejercicio 11.8</h1>
   <div class="enunciado"><i>(Quintillas)</i> Una quintilla es un verso humorístico de cinco líneas en el cual la primera y segunda línea riman con la quinta, y la tercera línea rima con la cuarta. Escriba una secuencia de comandos que produzca quintillas al azar.</div>
   <p><input type="button" id="btnGenerar" value="Generar quintillas"></p>
   <textarea id="salida" rows="24" readonly></textarea>
   <script>
var sujetos = ["gato", "payaso", "pirata", "abuelo", "dragón", "cartero", "pintor"];
// rima A: -ar (líneas 1, 2 y 5)  |  rima B: -ón (líneas 3 y 4)
var rimaA = ["bailar", "cantar", "saltar", "charlar", "pasear", "soñar", "nadar", "volar"];
var rimaB = ["balcón", "melón", "salón", "camión", "jabón", "corazón", "bastón"];
var inicioA1 = ["Un # que una tarde quiso", "Había un # que soñaba con", "Cierto # muy dado a"];
var inicioA2 = ["Se puso sin dudar a", "Y una noche le dio por", "Dejó su casa para"];
var inicioB  = ["Se escondió detrás de un", "Lo encontraron dentro de un", "Y se comió con gran pasión un", "Guardó su sombrero en el"];
var inicioA5 = ["Y todo el pueblo lo vio", "Y así acabó la historia sin dejar de", "Y fue feliz sin parar de"];

function elegir(a) { return a[Math.floor(Math.random() * a.length)]; }
function sacar(a) { return a.splice(Math.floor(Math.random() * a.length), 1)[0]; }

function quintilla() {
   var A = rimaA.slice(), B = rimaB.slice();
   var l1 = elegir(inicioA1).replace("#", elegir(sujetos)) + " " + sacar(A);
   var l2 = elegir(inicioA2) + " " + sacar(A);
   var l3 = elegir(inicioB) + " " + sacar(B);
   var l4 = elegir(inicioB) + " " + sacar(B);
   var l5 = elegir(inicioA5) + " " + sacar(A);
   return [l1, l2, l3, l4, l5].join("\n");
}
function generar() {
   var t = "";
   for (var i = 1; i <= 5; ++i) t += quintilla() + "\n\n";
   document.getElementById("salida").value = t;
}
window.addEventListener("load", function () {
   document.getElementById("btnGenerar").addEventListener("click", generar, false);
   generar();
}, false);
   </script>
