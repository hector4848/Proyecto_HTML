<!DOCTYPE html>

<!-- Formulario con un campo de texto y campos ocultos. -->

<html>

<head>

    <meta charset="utf-8">

    <title>Formularios</title>

<style>
.site-nav{position:sticky;top:0;z-index:9999;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;background:#1f2937;padding:12px;margin:0 0 20px;font-family:Arial,sans-serif}
.site-nav a{color:white;background:#2563eb;text-decoration:none;padding:9px 14px;border-radius:7px;font-size:14px}
.site-nav a:hover{background:#1d4ed8}
</style></head>

<body>

    <h1>Formulario de retroalimentación</h1>

    <p>
        Llene este formulario para ayudarnos
        a mejorar nuestro sitio.
    </p>

    <!-- esta etiqueta empieza el formulario, indica el -->
    <!-- método de enviar información y la ubicación -->
    <!-- de la secuencia de comandos de procesamiento del formulario -->

    <form method="post" action="http://www.deitel.com">

        <!-- las entradas ocultas contienen información -->
        <!-- no visual que también se enviará -->

        <input type="hidden"
               name="destinatario"
               value="deitel@deitel.com">

        <input type="hidden"
               name="asunto"
               value="Formulario de retroalimentación">

        <input type="hidden"
               name="redirigir"
               value="principal.html">

        <!-- <input type="text"> inserta un campo de texto -->

        <p>
            <label>
                Nombre:

                <input name="nombre"
                       type="text"
                       size="25"
                       maxlength="30">

            </label>
        </p>

        <p>

            <!-- los tipos de entrada "submit" y "reset" insertan -->
            <!-- botones para enviar y borrar el contenido -->
            <!-- del formulario, respectivamente -->

            <input type="submit" value="Enviar">

            <input type="reset" value="Borrar">

        </p>

    </form>
<p>
<a href="../ejemplos.html">Volver a ejemplos</a>
</p>

</div>
</body>

</html>
