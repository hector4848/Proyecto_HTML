<!DOCTYPE html>
<!-- Ejercicio 2.16: formulario de retroalimentación -->

<html>

<head>
    <meta charset="utf-8">
    <title>Formulario de retroalimentación</title>
<style>
.site-nav{position:sticky;top:0;z-index:9999;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;background:#1f2937;padding:12px;margin:0 0 20px;font-family:Arial,sans-serif}
.site-nav a{color:white;background:#2563eb;text-decoration:none;padding:9px 14px;border-radius:7px;font-size:14px}
.site-nav a:hover{background:#1d4ed8}
</style></head>

<body>

    <h1>Formulario de retroalimentación</h1>

    <p>
        Por favor, llene este formulario para ayudarnos
        a mejorar nuestra universidad.
    </p>

    <form method="post" action="http://www.deitel.com">

        <p>
            <label>Nombre:
                <input name="name" type="text" size="25">
            </label>
        </p>

        <p>
            <label>Correo electrónico:
                <input name="email" type="text" size="25">
            </label>
        </p>

        <p>
            <strong>¿Qué fue lo que más le gustó del campus?</strong><br>

            <label>Campus
                <input name="thingsliked" type="checkbox"
                       value="Campus">
            </label>

            <label>Estudiantes
                <input name="thingsliked" type="checkbox"
                       value="Estudiantes">
            </label>

            <label>Ubicación
                <input name="thingsliked" type="checkbox"
                       value="Ubicacion">
            </label>

            <label>Ambiente
                <input name="thingsliked" type="checkbox"
                       value="Ambiente">
            </label>

            <label>Dormitorios
                <input name="thingsliked" type="checkbox"
                       value="Dormitorios">
            </label>

            <label>Deportes
                <input name="thingsliked" type="checkbox"
                       value="Deportes">
            </label>
        </p>

        <p>
            <strong>¿Cómo supo de nuestra universidad?</strong><br>

            <label>Amigos
                <input name="howto" type="radio"
                       value="Amigos" checked>
            </label>

            <label>Televisión
                <input name="howto" type="radio"
                       value="Television">
            </label>

            <label>Internet
                <input name="howto" type="radio"
                       value="Internet">
            </label>

            <label>Otro
                <input name="howto" type="radio"
                       value="Otro">
            </label>
        </p>

        <p>
            <label>Comentarios adicionales:<br>
                <textarea name="comments" rows="4" cols="36">
                </textarea>
            </label>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Restablecer">
        </p>

    </form>
<p>

</p>

</body>

</html>
