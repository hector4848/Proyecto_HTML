<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Ejercicio 6.16 - Operaciones con dos números</title>
    <script>
        var primerNumero, segundoNumero, numero1, numero2;
        var suma, producto, diferencia, cociente;

        primerNumero = window.prompt("Escriba el primer número", "0");
        segundoNumero = window.prompt("Escriba el segundo número", "0");

        numero1 = parseInt(primerNumero);
        numero2 = parseInt(segundoNumero);

        suma = numero1 + numero2;
        producto = numero1 * numero2;
        diferencia = numero1 - numero2;
        cociente = numero1 / numero2;

        document.writeln("<h1>Resultados</h1>");
        document.writeln("<p>La suma es " + suma + "</p>");
        document.writeln("<p>El producto es " + producto + "</p>");
        document.writeln("<p>La diferencia es " + diferencia + "</p>");
        document.writeln("<p>El cociente es " + cociente + "</p>");
    </script>
</head>
