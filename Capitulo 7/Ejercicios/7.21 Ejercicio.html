<!DOCTYPE html>

<html lang="es">
<head>
   <meta charset="utf-8">
   <title>Múltiplos de 2</title>
   <script>

      var multiplo = 2; // empieza en 2

      // la condición siempre es verdadera, así que el ciclo nunca termina
      while ( true )
      {
         document.writeln( multiplo + "<br>" );
         multiplo = multiplo * 2;
      } // fin de while

   </script>
</head>
