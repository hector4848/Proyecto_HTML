<!DOCTYPE html>
<!-- Ejercicio 9.14: multiplo.html -->
<html>
<head>
<meta charset="utf-8">
<title>Ejercicio 9.14</title>
<style>body{font-family:Arial,sans-serif;max-width:700px;margin:30px auto;padding:0 16px}</style>
<script>
  function iniciar() {
    document.getElementById("botonComprobar").addEventListener("click", mostrarResultado, false);
  }

  function mostrarResultado() {
    var primero = parseInt(document.getElementById("campoPrimero").value);
    var segundo = parseInt(document.getElementById("campoSegundo").value);
    var esMultiplo = multiplo(primero, segundo);

    document.getElementById("resultado").innerHTML =
      segundo + " " + (esMultiplo ? "SÍ" : "NO") +
      " es múltiplo de " + primero + " (" + esMultiplo + ")";
  }

  function multiplo(primero, segundo) {
    if (primero === 0) {
      return false;
    }
    return segundo % primero === 0;
  }

  window.addEventListener("load", iniciar, false);
</script>
</head>
<body>
  <h2>9.14 ¿El segundo es múltiplo del primero?</h2>
  <form action="#">
    <p><label>Primer entero: <input id="campoPrimero" type="text"></label></p>
    <p><label>Segundo entero: <input id="campoSegundo" type="text"></label></p>
    <p><input id="botonComprobar" type="button" value="Comprobar"></p>
  </form>
  <p id="resultado"></p>
