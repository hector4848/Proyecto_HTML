<!DOCTYPE html>
<!-- Ejercicio 9.16: mostrarDigitos.html -->
<html>
<head>
<meta charset="utf-8">
<title>Ejercicio 9.16</title>
<style>body{font-family:Arial,sans-serif;max-width:700px;margin:30px auto;padding:0 16px}</style>
<script>
  // a) Parte entera del cociente de a entre b
  function cociente(a, b) {
    return Math.floor(a / b);
  }

  // b) Residuo entero de a entre b
  function residuo(a, b) {
    return a % b;
  }

  // c) Muestra un entero entre 1 y 99999 como dígitos separados por dos espacios
  function mostrarDigitos(numero) {
    var divisor = 10000;
    var salida = "";

    while (divisor > numero) {
      divisor = cociente(divisor, 10);
    }

    while (divisor >= 1) {
      salida += cociente(numero, divisor) + "&nbsp;&nbsp;";
      numero = residuo(numero, divisor);
      divisor = cociente(divisor, 10);
    }

    document.getElementById("salida").innerHTML = salida;
  }

  // d) Recibe un entero con prompt e invoca mostrarDigitos
  function iniciar() {
    var numero = parseInt(prompt("Introduzca un entero entre 1 y 99999:", "4562"));

    if (isNaN(numero) || numero < 1 || numero > 99999) {
      document.getElementById("salida").innerHTML = "Número no válido.";
    } else {
      mostrarDigitos(numero);
    }
  }

  window.addEventListener("load", iniciar, false);
</script>
</head>
<body>
  <h2>9.16 Mostrar dígitos</h2>
  <p id="salida"></p>
