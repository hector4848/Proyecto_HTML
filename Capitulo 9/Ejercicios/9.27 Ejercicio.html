<!DOCTYPE html>
<!-- Ejercicio 9.27: cai3.html -->
<html>
<head>
<meta charset="utf-8">
<title>Ejercicio 9.27</title>
<style>body{font-family:Arial,sans-serif;max-width:700px;margin:30px auto;padding:0 16px}</style>
<script>
  var respuestaCorrecta;
  var correctas = 0;
  var incorrectas = 0;

  // a) nivel de grado: número de dígitos máximo
  // b) tipo: 1 suma, 2 resta, 3 multiplicación, 4 división, 5 mezcla
  function nuevaPregunta() {
    var nivel = parseInt(document.getElementById("nivel").value);
    var tipo = parseInt(document.getElementById("tipo").value);
    var max = Math.pow(10, nivel);
    var a = 1 + Math.floor(Math.random() * (max - 1));
    var b = 1 + Math.floor(Math.random() * (max - 1));
    var texto;

    if (tipo === 5) {
      tipo = 1 + Math.floor(Math.random() * 4);
    }

    switch (tipo) {
      case 1:
        respuestaCorrecta = a + b;
        texto = "¿Cuánto es " + a + " más " + b + "?";
        break;
      case 2:
        if (b > a) { var t = a; a = b; b = t; }
        respuestaCorrecta = a - b;
        texto = "¿Cuánto es " + a + " menos " + b + "?";
        break;
      case 3:
        respuestaCorrecta = a * b;
        texto = "¿Cuánto es " + a + " por " + b + "?";
        break;
      case 4:
        respuestaCorrecta = a;       // cociente exacto
        a = a * b;
        texto = "¿Cuánto es " + a + " entre " + b + "?";
        break;
    }

    document.getElementById("pregunta").innerHTML = texto;
    document.getElementById("respuesta").value = "";
  }

  function mensajeCorrecto() {
    switch (1 + Math.floor(Math.random() * 4)) {
      case 1: return "Muy bien.";
      case 2: return "Excelente.";
      case 3: return "Buen trabajo.";
      case 4: return "Siga así.";
    }
  }

  function mensajeIncorrecto() {
    switch (1 + Math.floor(Math.random() * 4)) {
      case 1: return "No. Intente de nuevo";
      case 2: return "Equivocado. Trate una vez más.";
      case 3: return "No se dé por vencido.";
      case 4: return "No. Siga intentando.";
    }
  }

  function verificar() {
    var respuesta = parseInt(document.getElementById("respuesta").value);
    var mensaje;

    if (respuesta === respuestaCorrecta) {
      correctas++;
      mensaje = mensajeCorrecto();
      nuevaPregunta();
    } else {
      incorrectas++;
      mensaje = mensajeIncorrecto();
      document.getElementById("respuesta").value = "";
    }

    if (correctas + incorrectas === 10) {
      var porcentaje = correctas / 10 * 100;
      mensaje += "<br>Respuestas correctas: " + correctas + " de 10 (" + porcentaje + "%)";
      if (porcentaje < 75) {
        mensaje += "<br><b>Pida ayuda adicional a su instructor</b>";
      }
      correctas = 0;
      incorrectas = 0;
      nuevaPregunta();
    }

    document.getElementById("mensaje").innerHTML = mensaje;
  }

  function iniciar() {
    document.getElementById("boton").addEventListener("click", verificar, false);
    document.getElementById("nivel").addEventListener("change", nuevaPregunta, false);
    document.getElementById("tipo").addEventListener("change", nuevaPregunta, false);
    nuevaPregunta();
  }

  window.addEventListener("load", iniciar, false);
</script>
</head>
<body>
  <h2>9.27 CAI con nivel y tipo de problema</h2>
  <form action="#">
    <p><label>Nivel de grado (dígitos):
      <select id="nivel">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select></label></p>
    <p><label>Tipo de problema:
      <select id="tipo">
        <option value="1">1 - Suma</option>
        <option value="2">2 - Resta</option>
        <option value="3">3 - Multiplicación</option>
        <option value="4">4 - División</option>
        <option value="5">5 - Mezcla</option>
      </select></label></p>
    <p id="pregunta"></p>
    <p><input id="respuesta" type="number">
    <input id="boton" type="button" value="Responder"></p>
  </form>
  <p id="mensaje"></p>
