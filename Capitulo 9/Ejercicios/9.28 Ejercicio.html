<!DOCTYPE html>
<!-- Ejercicio 9.28: craps.html -->
<html>
<head>
<meta charset="utf-8">
<title>Ejercicio 9.28</title>
<style>body{font-family:Arial,sans-serif;max-width:700px;margin:30px auto;padding:0 16px}</style>
<script>
  var saldoBanco = 1000;

  function tirarDados() {
    var d1 = 1 + Math.floor(Math.random() * 6);
    var d2 = 1 + Math.floor(Math.random() * 6);
    return [d1, d2];
  }

  // Selecciona al azar la cadena de conversación
  function conversacion() {
    switch (Math.floor(Math.random() * 4)) {
      case 0: return "¿Así que se va a quedar en bancarrota?";
      case 1: return "¡Vamos, arriésguese!";
      case 2: return "¡Está teniendo éxito!";
      case 3: return "¡Ahora es momento de cambiar sus fichas!";
    }
  }

  function jugar() {
    var apuesta = parseFloat(document.getElementById("apuesta").value);
    var salida = document.getElementById("salida");

    // Se pide la apuesta de nuevo hasta que sea válida
    if (isNaN(apuesta) || apuesta <= 0 || apuesta > saldoBanco) {
      salida.innerHTML = "Apuesta no válida. Debe ser mayor que 0 y menor o igual que su saldo ($" +
                         saldoBanco + "). Introduzca otra apuesta.";
      return;
    }

    var texto = "";
    var dados = tirarDados();
    var suma = dados[0] + dados[1];
    var gana;

    texto += "Tiró " + dados[0] + " + " + dados[1] + " = " + suma + "<br>";

    if (suma === 7 || suma === 11) {
      gana = true;
    } else if (suma === 2 || suma === 3 || suma === 12) {
      gana = false;
    } else {
      var punto = suma;
      texto += "Su punto es " + punto + "<br>";
      while (true) {
        dados = tirarDados();
        suma = dados[0] + dados[1];
        texto += "Tiró " + dados[0] + " + " + dados[1] + " = " + suma + "<br>";
        if (suma === punto) { gana = true; break; }
        if (suma === 7) { gana = false; break; }
      }
    }

    if (gana) {
      saldoBanco += apuesta;
      texto += "<b>El jugador gana.</b><br>";
    } else {
      saldoBanco -= apuesta;
      texto += "<b>El jugador pierde.</b><br>";
    }

    texto += "Nuevo saldo: $" + saldoBanco + "<br>";

    if (saldoBanco === 0) {
      texto += "<b>Lo siento. ¡Está en bancarrota!</b>";
      document.getElementById("botonJugar").disabled = true;
    } else {
      texto += conversacion();
    }

    salida.innerHTML = texto;
  }

  function iniciar() {
    document.getElementById("botonJugar").addEventListener("click", jugar, false);
  }

  window.addEventListener("load", iniciar, false);
</script>
</head>
<body>
  <h2>9.28 Craps con apuestas</h2>
  <p>Saldo inicial: $1000</p>
  <form action="#">
    <p><label>Apuesta: <input id="apuesta" type="number" step="any"></label>
    <input id="botonJugar" type="button" value="Jugar"></p>
  </form>
  <div id="salida"></div>
