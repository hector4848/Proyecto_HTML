<!DOCTYPE html>
<!-- Ejercicio 9.29: potenciaRecursiva.html -->
<html>
<head>
<meta charset="utf-8">
<title>Ejercicio 9.29</title>
<style>body{font-family:Arial,sans-serif;max-width:700px;margin:30px auto;padding:0 16px}</style>
<script>
  function potencia(base, exponente) {
    if (exponente === 1) {
      return base;                                // condición de terminación
    } else {
      return base * potencia(base, exponente - 1); // paso recursivo
    }
  }

  function iniciar() {
    document.getElementById("boton").addEventListener("click", function () {
      var base = parseInt(document.getElementById("campoBase").value);
      var exponente = parseInt(document.getElementById("campoExponente").value);

      if (isNaN(base) || isNaN(exponente) || exponente < 1) {
        document.getElementById("resultado").innerHTML = "El exponente debe ser un entero mayor o igual a 1.";
        return;
      }
      document.getElementById("resultado").innerHTML =
        base + " elevado a la " + exponente + " = " + potencia(base, exponente);
    }, false);
  }

  window.addEventListener("load", iniciar, false);
</script>
</head>
<body>
  <h2>9.29 Potencia recursiva</h2>
  <form action="#">
    <p><label>Base: <input id="campoBase" type="text"></label></p>
    <p><label>Exponente: <input id="campoExponente" type="text"></label></p>
    <p><input id="boton" type="button" value="Calcular"></p>
  </form>
  <p id="resultado"></p>
