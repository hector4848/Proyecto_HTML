<!DOCTYPE html>
<!-- Ejercicio 9.9: distancia.html -->
<html>
<head>
<meta charset="utf-8">
<title>Ejercicio 9.9</title>
<style>body{font-family:Arial,sans-serif;max-width:700px;margin:30px auto;padding:0 16px}</style>
<script>
  function iniciar() {
    document.getElementById("botonCalcular").addEventListener("click", mostrarDistancia, false);
  }

  function mostrarDistancia() {
    var x1 = parseFloat(document.getElementById("x1").value);
    var y1 = parseFloat(document.getElementById("y1").value);
    var x2 = parseFloat(document.getElementById("x2").value);
    var y2 = parseFloat(document.getElementById("y2").value);

    document.getElementById("resultado").innerHTML =
      "La distancia entre los puntos es: " + distancia(x1, y1, x2, y2);
  }

  function distancia(x1, y1, x2, y2) {
    return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
  }

  window.addEventListener("load", iniciar, false);
</script>
</head>
<body>
  <h2>9.9 Distancia entre dos puntos</h2>
  <form action="#">
    <p>Punto 1: x1 <input id="x1" type="number" step="any">
       y1 <input id="y1" type="number" step="any"></p>
    <p>Punto 2: x2 <input id="x2" type="number" step="any">
       y2 <input id="y2" type="number" step="any"></p>
    <p><input id="botonCalcular" type="button" value="Calcular"></p>
  </form>
  <p id="resultado"></p>
