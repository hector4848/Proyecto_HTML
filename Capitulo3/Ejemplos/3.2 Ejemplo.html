<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <title>El nuevo atributo autocomplete y el elemento datalist de HTML5</title>
<style>
.site-nav{position:sticky;top:0;z-index:9999;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;background:#1f2937;padding:12px;margin:0 0 20px;font-family:Arial,sans-serif}
.site-nav a{color:white;background:#2563eb;text-decoration:none;padding:9px 14px;border-radius:7px;font-size:14px}
.site-nav a:hover{background:#1d4ed8}
</style></head>

<body>
    <h1>Demo de autocomplete y datalist</h1>
    <p>Este formulario demuestra el nuevo atributo autocomplete de HTML
        y el elemento datalist.
    </p>

    <form method="post" autocomplete="on">
        <p><label>Primer nombre:
                <input type="text" id="primerNombre" placeholder="Primer nombre" /> (Primer nombre)
            </label></p>
        <p><label>Apellido:
                <input type="text" id="apellido" placeholder="Apellido" /> (Apellido)
            </label></p>
        <p><label>Email:
                <input type="email" id="email" placeholder="nombre@dominio.com" /> (nombre@dominio.com)
            </label></p>
        <p><label for="listaTexto">Mes de nacimiento:
                <input type="text" id="listaTexto" placeholder="Seleccione un mes" list="meses" />
                <datalist id="meses">
                    <option value="Enero">
                    <option value="Febrero">
                    <option value="Marzo">
                    <option value="Abril">
                    <option value="Mayo">
                    <option value="Junio">
                    <option value="Julio">
                    <option value="Agosto">
                    <option value="Septiembre">
                    <option value="Octubre">
                    <option value="Noviembre">
                        coption value = "Diciembre">
                </datalist>
            </label></p>
        <p><input type="submit" value="Enviar" />
            <input type="reset" value="Borrar" />
        </p>
        <p><a href="../index.html">&#8592; Volver a selección de Ejemplos</a></p>

    </form>

</body>

</html>
