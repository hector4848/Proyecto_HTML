<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Gradiente lineal</title>
    <style tipe="text/css">
        div {
            width: 200px;
            height: 200px;
            border: 3px solid navy;
            padding: 5px 20px;
            text-align: center;
            background: -webkit-gradient(linear, center top, center bottom,
                    color-stop(15%, white), color-stop(50%, lightsteelblue),
                    color-stop(15%, navy));
            background: -moz-linear-gradient(top center, white 15%, lightsteelblue 50%, navy 75%);
            background: linear-gradient(top, white 15%, lightsteelblue 50%, navy 75%);
            float: left;
            margin-right: 15px;
        }

        #horizontal{
            width: 200px;
            height: 200px;
            border: 3px solid orange;
            padding: 5px 20px;
            text-align: center;
            background: -webkit-gradient(linear, left top, right top,
                    color-stop(15%, white), color-stop(50%, yellow), color-stop(75%, orange));
            background: -moz-linear-gradient(left, white 15%, yellow 50%, orange 75%);
            background: linear-gradient(left, white 15%, yellow 50%, orange 75%);
            margin-right: 15px;
        }

        #diagonal{
            width: 200px;
            height: 200px;
            border: 3% solid purple;
            padding: 5px 20px;
            text-align: center;
            background: -webkit-gradient(linear, left top, right bottom,
                    color-stop(15%, white), color-stop(50%, plum),
                    color-stop(75%, purple));
            background: -moz-linear-gradient(top left, white 15%, plum 50%, purple 75%);
            background: linear-gradient( 135deg, white 15%, plum 50%, purple 75% );
        }
    </style>
<style id="site-nav-css">
html{padding-bottom:70px}
#site-nav{position:fixed;left:0;right:0;bottom:0;z-index:99999;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;background:#1f2937;padding:12px;margin:0;font-family:Arial,sans-serif;box-shadow:0 -2px 10px rgba(0,0,0,.25)}

#site-nav a:hover{background:#1d4ed8}
</style>
</head>

<body>
    <div><h2>Gradiente lineal</h2></div>
    <div id="horizontal"><h2>Gradiente lineal horizontal</h2></div>
    <div id="diagonal"><h2>Gradiente lineal diagonal</h2></div>
