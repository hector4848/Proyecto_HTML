<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Transformación con :hover</title>
<style>
body {
  font-family: Arial, Helvetica, sans-serif;
  text-align: center;
  padding: 30px;
}
.galeria {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin-top: 50px;
}
.galeria img {
  width: 150px;
  height: 150px;
  object-fit: cover;
  border: 2px solid #333;
  border-radius: 8px;
  transition: transform 0.4s;     /* Animación suave */
}
.galeria img:hover {
  transform: scale(1.2);          /* Aumenta el tamaño un 20% */
}
</style>
<style id="site-nav-css">
html{padding-bottom:70px}
#site-nav{position:fixed;left:0;right:0;bottom:0;z-index:99999;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;background:#1f2937;padding:12px;margin:0;font-family:Arial,sans-serif;box-shadow:0 -2px 10px rgba(0,0,0,.25)}
#site-nav a{color:#fff;background:#2563eb;text-decoration:none;padding:9px 14px;border-radius:7px;font-size:14px;font-family:Arial,sans-serif;line-height:1.2}
#site-nav a:hover{background:#1d4ed8}
</style>
</head>
<body>

<h1>Pasa el ratón sobre cada imagen</h1>

<div class="galeria">
  <img src="imagenes/kaneki.png" alt="Kaneki">
  <img src="imagenes/ojo.png" alt="Ojo">
  <img src="imagenes/fuego.png" alt="Fuego">
  <img src="imagenes/pelo.png" alt="Pelo">
</div>

</div>
</body>
</html>
