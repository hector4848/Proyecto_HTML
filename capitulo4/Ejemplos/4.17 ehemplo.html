<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <title>Menú desplegable</title>

    <style type="text/css">

        /* Menú principal */
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        /* Elemento que contiene el menú */
        li {
            position: relative;
            width: 120px;
        }

        /* Menú contraído */
        li ul {
            display: none;
            position: absolute;
            left: 0;
            top: 100%;
            padding: 0;
            margin: 0;
        }

        /* Al pasar el ratón sobre "Menú" */
        li:hover ul {
            display: block;
        }

        /* Vínculos */
        a {
            display: block;
            padding: 5px;
            text-decoration: none;
            background-color: white;
            color: black;
        }

        /* El vínculo cambia al pasar el ratón */
        a:hover {
            background-color: lightgray;
        }

    </style>

.navegacion-cap4 {
